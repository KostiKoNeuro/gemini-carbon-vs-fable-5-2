      g2.addColorStop(0,'rgba(255,255,255,1)');g2.addColorStop(.3,od?'rgba(255,200,40,.8)':'rgba(5,217,232,.7)');g2.addColorStop(1,'rgba(255,42,109,0)');U.fillStyle=g2;U.fillRect(fxp-dh*.4,fy-dh*.3,dh*.8,dh*.9)}}
  if(dead){U.globalCompositeOperation='lighter';const r=dw*(.5+rnd(.12)),g3=U.createRadialGradient(0,-dh*.4,2,0,-dh*.5,r);
    g3.addColorStop(0,'rgba(255,230,150,.75)');g3.addColorStop(.4,'rgba(255,90,20,.4)');g3.addColorStop(1,'rgba(255,40,0,0)');U.fillStyle=g3;U.fillRect(-r,-dh*.5-r,r*2,r*2)}
  U.restore();U.globalAlpha=1;U.globalCompositeOperation='source-over'}
function drawHI(x,y,sz,lh,blink){HI.forEach((h,i)=>{const me=h.me,c=me?(blink?'#ffffff':'#ffd319'):['#ffd319','#05d9e8','#ff2a6d'][Math.min(i,2)];

      txt(l,W/2,cy+i*fs*2.5,fs,['#05d9e8','#ffffff','#ffd319','#ff2a6d'][i],'center',6))}

}
function drawOver(t,blink){
  U.fillStyle='rgba(5,1,13,.74)';U.fillRect(0,0,W,H);const gs=Math.min(64,W*.085),j=Math.sin(t*37)>.9?rnd(-7,7):0,wide=W>=980;

    for(let i=0;i<3;i++){const x=W/2+(i-1)*70,a=i===GM.iniP;txt(CH[GM.ini[i]]===' '?'_':CH[GM.ini[i]],x,H*.8,46,a?'#ffffff':'#05d9e8','center');if(a&&blink){U.fillStyle='#ff2a6d';U.fillRect(x-26,H*.8+8,52,5)}}
    txt(isTouch?'TAP — OK':'↑↓ БУКВА   < > ПОЗИЦИЯ   ENTER — OK',W/2,H*.9,10,'#8a7ab8','center',0)}
  else if(GM.stT>.5){if(blink)txt(isTouch?'TAP — ЕЩЁ РАЗ!':'ENTER — ЕЩЁ РАЗ!',W/2,H*.76,Math.min(24,W/32),'#ffffff','center');txt('ESC — МЕНЮ',W/2,H*.76+34,10,'#8a7ab8','center',0)}
}
function drawHUD(rdt){
  U.setTransform(1,0,0,1,0,0);U.clearRect(0,0,W,H);U.shadowBlur=0;U.globalAlpha=1;U.textBaseline='alphabetic';U.drawImage(OV,0,0);
  const st=GM.state,t=GM.time,sp=P.v/12000,blink=(t*2.6|0)%2,beat=AU.ctx?Math.max(0,1-(AU.ctx.currentTime-AU.beat)*3.2):0,od=GM.odT>0;
  const nar=W<700;drawPlayer(t,sp,beat);
  U.globalCompositeOperation='lighter';for(const p of PT){U.globalAlpha=1-p.t/p.life;U.fillStyle=p.col;U.fillRect(p.x,p.y,p.sz,p.sz)}U.globalCompositeOperation='source-over';U.globalAlpha=1;

    txt('SCORE',22,30,10,'#05d9e8','left',4);txt(pad(GM.score,7),22,nar?54:62,nar?16:24,'#ffffff');txt('HI '+pad(Math.max(HI[0].s,GM.score),7),22,nar?72:84,nar?8:10,'#ff2a6d','left',4);
    const kmh=Math.round(P.v/40),sc_=od?'#ffd319':sp>.95?'#ff7ab0':'#ffffff';U.save();U.transform(1,0,-.2,1,0,0);U.font=`900 ${nar?40:62}px ${OB}`;U.textAlign='right';U.shadowColor=sc_;U.shadowBlur=22;U.fillStyle=sc_;
    U.fillText(kmh,W-(nar?46:66),nar?60:70);U.restore();txt('KM/H',W-(nar?12:20),nar?60:70,nar?6:9,'#05d9e8','right',4);
    U.shadowBlur=0;for(let i=0;i<24;i++){const on=i/24<sp/1.45;U.fillStyle=on?(i>19?'#ffd319':i>13?'#ff2a6d':'#05d9e8'):'rgba(255,255,255,.12)';U.fillRect(W-22-(24-i)*9,82,6,on?12:8)}
    if(GM.mult>1){const pop=1+Math.max(0,GM.chainT-4.2)*1.5;const cy=nar?96:0;txt('CHAIN',W/2,cy+26,9,'#05d9e8','center',4);txt('x'+GM.mult,W/2,cy+26+38*pop,34*pop,GM.mult>=10?'#ffd319':'#ffffff','center');
      U.shadowBlur=0;U.fillStyle='rgba(255,255,255,.15)';U.fillRect(W/2-70,cy+76,140,5);U.fillStyle=GM.chainT<1.2?'#ff2a6d':'#05d9e8';U.fillRect(W/2-70,cy+76,140*clamp(GM.chainT/4.5,0,1),5)}

    txt(od?'OVERDRIVE!!':full?(blink?(isTouch?'TAP x2 FINGERS':'PRESS SPACE'):'OVERDRIVE READY'):'OVERDRIVE',W/2,H-36,9,oc,'center',full||od?10:3);U.shadowBlur=0;
    for(let i=0;i<n;i++){const on=i/n<v-.001;U.fillStyle=on?(full&&!blink?'#ffffff':oc):'rgba(255,255,255,.13)';U.shadowColor=oc;U.shadowBlur=on?8:0;U.fillRect(x0+i*bw/n,H-28,bw/n-3,12)}
    U.shadowBlur=0;const yb=nar?30:0;txt((P.z/144000).toFixed(2)+' KM',22,H-40-yb,14,'#ffffff');txt('SECTOR '+pad(GM.sector+1,2)+' · '+PAL[GM.pal].name,22,H-18-yb,nar?7:9,'#05d9e8','left',4);

  }
  for(const f of FT){const a=f.t,sz=Math.min(f.size*(1+Math.max(0,.18-a)*3),(W-24)/f.txt.length);U.globalAlpha=clamp((1.4-a)*2,0,1);txt(f.txt,clamp(W*f.x,sz*f.txt.length*.5+8,W-sz*f.txt.length*.5-8),H*f.y-a*70,sz,f.col,'center')}
  U.globalAlpha=1;
  if(GM.banner&&st==='play'){const b=GM.banner,a=clamp(Math.min(b.t*3,(3.2-b.t)*2),0,1),ox=(1-ease(clamp(b.t*2.5,0,1)))*-W*.4;U.globalAlpha=a;
    U.fillStyle='rgba(5,1,13,.55)';U.fillRect(0,H*.2,W,H*.14);txt(b.txt,W/2+ox,H*.2+H*.075,Math.min(38,W/22),'#ffffff','center');txt(b.sub,W/2-ox,H*.2+H*.12,Math.min(13,W/60),PAL[GM.pal].lane,'center');U.globalAlpha=1}
  if(st==='title')drawTitle(t,blink);

  if(AU.muted)txt('MUTE',W-20,H-40,9,'#ff2a6d','right',0);
  U.shadowBlur=0;
}

function resize(){
  const a=clamp(innerWidth/innerHeight,.5,2.4);H=720;W=Math.round(H*a/2)*2;F=Math.min(H,W*.8)*.9;CAMH=820*clamp(1150/W,1,3.2);
  for(const c of [fx,hud,sc]){c.width=W;c.height=H}bl.width=W>>2;bl.height=H>>2;
  BG.length=0;for(const p of PAL)BG.push(mkBG(p));OV=mkOV();X.fillStyle='#000';X.fillRect(0,0,W,H);
}
let rzT=0;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(resize,120)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&GM.state==='play')GM.state='pause'});
let last=0;
function frame(ts){
  requestAnimationFrame(frame);const rdt=Math.min(.05,(ts-last)/1000||.016);last=ts;GM.fps=lerp(GM.fps,1/rdt,.05);
  update(rdt);if(GM.state==='over'&&GM.stT>30)toTitle();
  render(GM.state==='pause'?0:rdt*GM.ts);drawHUD(rdt);
}
function boot(){resize();buildSprites();GM.auto=/[?&]auto/.test(location.search);toTitle();requestAnimationFrame(frame)}
const fl=document.fonts&&document.fonts.load?Promise.race([Promise.all([document.fonts.load('20px "Press Start 2P"','AЯ'),document.fonts.load('900 20px Orbitron','A')]),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
fl.then(boot,boot);
window.NNR={GM,P,AU,cars:()=>cars,segs:()=>S,sim(n,dt=1/60){for(let i=0;i<n;i++)update(dt)},start:startGame,od:tryOD};
