function signXY(x, y, z, text, col, e = 2.6, board = 0x0b0c12) {
  let cx = x;

    for (let r = 0; r < rows.length; r++) for (let c = 0; c < w; c++) {
      if (board !== null) put(cx + c, y - r, z - 1, board);
      if (rows[r][c] === '#') put(cx + c, y - r, z, col, e, 0); }
    cx += w + 1; }

}

    cy -= rows.length + 1; }
